# Builds the broker image Market Canopy deploys: upstream Open Connector at the
# release the VM runs, with the patches in patches/ applied
# (platform-api prompts/integrations/2026-10-16-broker-attempt-ownership.md).
name: broker-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/broker-image.yml'
  pull_request:
    paths:
      - 'patches/**'
      - '.github/workflows/broker-image.yml'

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPOSITORY: oomol-lab/open-connector
  UPSTREAM_TAG: v1.10.0
  UPSTREAM_COMMIT: dc90106c23383e5311a2710153971e95290b85a3
  IMAGE: ghcr.io/marketcanopy/open-connector
  IMAGE_TAG: v1.10.0-owner.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: openconnect
          persist-credentials: false

      - name: Check out upstream at the deployed tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ env.UPSTREAM_TAG }}
          path: upstream
          persist-credentials: false

      - name: Confirm the tag is the pinned commit
        working-directory: upstream
        run: test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply the patches
        working-directory: upstream
        run: |
          for patch in ../openconnect/patches/*.patch; do
            echo "applying $patch"
            git apply --index "$patch"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # No lifecycle scripts: the upstream postinstall only regenerates files the
      # tests and the image build generate themselves.
      - name: Install
        working-directory: upstream
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test the routes the patches touch
        working-directory: upstream
        run: npx vitest run src/server/api/

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push from main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/docker/Dockerfile
          platforms: linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Record the digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image: ${IMAGE}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin it in infra/docker-compose.yml, scripts/Deploy-OpenConnector.ps1 and README.md." >> "$GITHUB_STEP_SUMMARY"
